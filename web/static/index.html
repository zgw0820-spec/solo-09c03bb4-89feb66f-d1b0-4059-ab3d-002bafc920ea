<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>检修事件投递操作台</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --line: #d9dee4; --text: #1f2933;
    --muted: #66707a; --blue: #1d4ed8; --red: #b91c1c; --green: #15803d;
    --amber: #b45309; --grey: #475569;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }
  header { background: #0f172a; color: #fff; padding: 14px 24px;
           display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  main { max-width: 1180px; margin: 20px auto; padding: 0 16px; display: grid;
         grid-template-columns: 340px 1fr; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; padding-bottom: 8px;
             border-bottom: 1px solid var(--line); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
          border-radius: 6px; font-size: 14px; font-family: inherit; }
  button { background: var(--blue); color: #fff; border: 0; border-radius: 6px;
           padding: 9px 16px; font-size: 14px; cursor: pointer; margin-top: 14px; }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: var(--grey); }
  button.danger { background: var(--red); }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { margin: 0; background: #e2e8f0; color: var(--text); padding: 7px 14px; }
  .tabs button.active { background: var(--blue); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 7px 8px; text-align: left;
           vertical-align: top; word-break: break-all; }
  th { background: #f1f5f9; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
           font-size: 12px; color: #fff; white-space: nowrap; }
  .b-pending { background: var(--grey); }
  .b-processing { background: #7c3aed; }
  .b-rejected { background: var(--amber); }
  .b-quarantined { background: var(--red); }
  .b-accepted { background: var(--green); }
  .muted { color: var(--muted); font-size: 12px; }
  .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px;
         display: none; white-space: pre-wrap; }
  .msg.ok { display: block; background: #dcfce7; color: var(--green); }
  .msg.err { display: block; background: #fee2e2; color: var(--red); }
  .replay-row { display: flex; gap: 6px; }
  .replay-row input { padding: 5px 7px; font-size: 12px; }
  .replay-row button { margin: 0; padding: 5px 10px; font-size: 12px; }
  .scroll { max-height: 520px; overflow: auto; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>检修事件投递操作台</h1>
  <span class="muted" style="color:#94a3b8">故障/恢复事件 · 队列投递 · 隔离重放 · 接收端派单</span>
  <label class="auto"><input type="checkbox" id="autoRefresh" checked /> 3 秒自动刷新</label>
</header>

<main>
  <div>
    <div class="card">
      <h2>提交事件（按设备号递增序号）</h2>
      <label>设备号 *</label>
      <input id="deviceId" placeholder="例如 DEV-1001" />
      <label>事件类型 *</label>
      <select id="eventType">
        <option value="fault">故障 fault</option>
        <option value="recovery">恢复 recovery</option>
      </select>
      <label>班组号（故障缺失将被接收端拒收）</label>
      <input id="teamNo" placeholder="例如 TEAM-A7" />
      <label>描述</label>
      <textarea id="description" rows="2"></textarea>
      <button onclick="submitEvent()">提交事件</button>
      <div id="submitMsg" class="msg"></div>
      <div class="hint">同一设备每次提交自动分配递增序号 <code>seq</code>，
        事件唯一键为 <code>设备号:序号</code>。</div>
    </div>

    <div class="card">
      <h2>手动刷新</h2>
      <button class="secondary" onclick="refreshAll()">立即刷新全部</button>
      <div class="hint">故障两次显式拒收后进入隔离；恢复事件不受影响照常投递。</div>
    </div>
  </div>

  <div>
    <div class="card">
      <div class="tabs">
        <button class="active" data-tab="events" onclick="switchTab('events')">事件队列</button>
        <button data-tab="quarantine" onclick="switchTab('quarantine')">隔离消息 / 重放</button>
        <button data-tab="workorders" onclick="switchTab('workorders')">接收端派单</button>
        <button data-tab="devstate" onclick="switchTab('devstate')">设备最新状态</button>
        <button data-tab="log" onclick="switchTab('log')">状态流转日志</button>
      </div>

      <div id="tab-events">
        <div class="scroll"><table id="eventsTable"></table></div>
      </div>
      <div id="tab-quarantine" style="display:none">
        <div class="scroll"><table id="quarantineTable"></table></div>
      </div>
      <div id="tab-workorders" style="display:none">
        <div class="scroll"><table id="workOrdersTable"></table></div>
      </div>
      <div id="tab-devstate" style="display:none">
        <div class="scroll"><table id="deviceStateTable"></table></div>
      </div>
      <div id="tab-log" style="display:none">
        <div class="scroll"><table id="logTable"></table></div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function badge(status) {
  return `<span class="badge b-${esc(status)}">${esc(status)}</span>`;
}
function showMsg(el, ok, text) {
  el.className = "msg " + (ok ? "ok" : "err");
  el.textContent = text;
}
async function api(path, opts) {
  const resp = await fetch(path, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const detail = typeof data.detail === "object"
      ? JSON.stringify(data.detail) : (data.detail || resp.statusText);
    throw new Error(detail);
  }
  return data;
}

async function submitEvent() {
  const body = {
    device_id: $("deviceId").value.trim(),
    event_type: $("eventType").value,
    team_no: $("teamNo").value.trim() || null,
    description: $("description").value.trim() || null,
  };
  if (!body.device_id) {
    showMsg($("submitMsg"), false, "请填写设备号"); return;
  }
  try {
    const data = await api("/api/events", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    showMsg($("submitMsg"), true,
      `已提交：${data.event_key}（seq=${data.seq}），等待工作器投递`);
    $("description").value = "";
    refreshAll();
  } catch (e) {
    showMsg($("submitMsg"), false, "提交失败：" + e.message);
  }
}

function switchTab(tab) {
  document.querySelectorAll(".tabs button").forEach((b) =>
    b.classList.toggle("active", b.dataset.tab === tab));
  ["events", "quarantine", "workorders", "devstate", "log"].forEach((t) =>
    $(`tab-${t}`).style.display = t === tab ? "" : "none");
}

async function replay(eventKey) {
  const input = document.getElementById(`replay-${eventKey}`);
  const teamNo = input.value.trim();
  if (!teamNo) { alert("请先补全班组号"); return; }
  try {
    const data = await api(`/api/quarantine/${encodeURIComponent(eventKey)}/replay`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({team_no: teamNo}),
    });
    alert(data.message || "已重新入队");
    refreshAll();
  } catch (e) {
    alert("重放失败：" + e.message);
  }
}
window.replay = replay;

function table(el, headers, rows) {
  let html = "<thead><tr>" + headers.map((h) => `<th>${esc(h)}</th>`).join("")
           + "</tr></thead><tbody>";
  if (!rows.length) {
    html += `<tr><td colspan="${headers.length}" class="muted">（暂无数据）</td></tr>`;
  } else {
    html += rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("");
  }
  el.innerHTML = html + "</tbody>";
}

async function loadEvents() {
  const data = await api("/api/events");
  table($("eventsTable"),
    ["事件键", "设备", "序号", "类型", "状态", "尝试次数", "班组号",
     "最近错误", "接收端响应", "下次尝试", "更新时间"],
    data.events.map((e) => [
      esc(e.event_key), esc(e.device_id), e.seq, esc(e.event_type),
      badge(e.status), e.attempts,
      esc(e.payload?.team_no || "—"),
      esc(e.last_error || "—"),
      `<code>${esc(e.last_response ? JSON.stringify(e.last_response) : "—")}</code>`,
      esc(e.next_attempt_at || "—"), esc(e.updated_at),
    ]));
}

async function loadQuarantine() {
  const data = await api("/api/quarantine");
  table($("quarantineTable"),
    ["事件键", "设备", "序号", "类型", "隔离原因", "隔离时间",
     "重放状态", "补全班组号并重放"],
    data.quarantine.map((q) => [
      esc(q.event_key), esc(q.device_id), q.seq, esc(q.event_type),
      esc(q.reason), esc(q.quarantined_at),
      q.replay_status === "replayed"
        ? badge("accepted") + " 已重放"
        : badge("quarantined") + " 待重放",
      q.replay_status === "replayed" ? "—" :
        `<div class="replay-row">
           <input id="replay-${esc(q.event_key)}" placeholder="班组号" />
           <button onclick="replay('${esc(q.event_key)}')">重放</button>
         </div>`,
    ]));
}

async function loadWorkOrders() {
  const data = await api("/api/receiver/work-orders");
  const rows = (data.work_orders || []).map((w) => [
    esc(w.work_order_no), esc(w.event_key), esc(w.device_id), w.seq,
    esc(w.event_type), esc(w.team_no || "—"),
    w.is_replay ? "是（重放）" : "否", esc(w.received_at),
  ]);
  table($("workOrdersTable"),
    ["工单号", "事件键", "设备", "序号", "类型", "班组号", "重放", "接收时间"], rows);
}

async function loadDeviceState() {
  const data = await api("/api/receiver/device-state");
  table($("deviceStateTable"),
    ["设备", "最新序号", "最新事件键", "最新类型", "更新时间"],
    (data.device_state || []).map((d) => [
      esc(d.device_id), d.latest_seq, esc(d.latest_event_key),
      badge(d.latest_type), esc(d.updated_at),
    ]));
}

async function loadLog() {
  const data = await api("/api/status-log");
  table($("logTable"), ["时间", "事件键", "从", "到", "说明"],
    data.status_log.map((l) => [
      esc(l.created_at), esc(l.event_key),
      l.from_status ? badge(l.from_status) : "—",
      badge(l.to_status), esc(l.detail || ""),
    ]));
}

async function refreshAll() {
  const tasks = [loadEvents, loadQuarantine, loadWorkOrders,
                 loadDeviceState, loadLog];
  await Promise.all(tasks.map((fn) =>
    fn().catch((e) => console.error(fn.name, e))));
}

refreshAll();
setInterval(() => { if ($("autoRefresh").checked) refreshAll(); }, 3000);
</script>
</body>
</html>
